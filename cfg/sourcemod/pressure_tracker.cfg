// ============================================================================
// Pressure Tracker Configuration
// ============================================================================
// Global pressure tracking system with tier-based difficulty adjustment.
// Pressure value ranges from 20-100, starting at 40 (standard difficulty).
//
// Tier system:
//   T1 (20-35)  : Casual    - 3 batches, long rest, conservative AI
//   T2 (35-50)  : Standard  - 2 batches, normal rest, balanced AI
//   T3 (50-65)  : Challenge - 2 batches, short rest, standard AI
//   T4 (65-80)  : Hard      - 1 batch, very short rest, aggressive AI
//   T5 (80-100) : Hell      - 1 batch, minimal rest, very aggressive AI
//
// Tier transitions require 3+ consecutive waves (T4->T5 requires 5 waves).
// ============================================================================

// ==================== Core Settings ====================
sm_pressure_enable "1"
sm_pressure_announce "1"

// ==================== Pressure Change Rates (Tightened) ====================
// Pressure gain (heating)
sm_pressure_perfect_wave "5"        // Perfect wave (zero incaps/deaths)
sm_pressure_fast_clear "3"          // Fast clear (<25s)
sm_pressure_perfect_streak "8"      // Bonus for 5 consecutive perfect waves

// Pressure loss (cooling)
sm_pressure_incap_penalty "4"       // Per incap
sm_pressure_death_penalty "8"       // Per death
sm_pressure_wipe_reset "30"         // Team wipe resets to this value
sm_pressure_slow_clear "3"          // Slow clear (>60s)
sm_pressure_damage_threshold "200"  // HP threshold for damage penalty
sm_pressure_damage_penalty "2"      // When total damage exceeds threshold

// Natural decay
sm_pressure_decay_per_wave "1"      // Per wave (prevents infinite accumulation)

// ==================== Published CVars (Read by Other Plugins) ====================
// These are automatically updated by pressure_tracker:
//   sm_pressure_value      - Current pressure (20-100)
//   sm_pressure_tier       - Current tier (1-5)
//   sm_pressure_aggression - AI aggression multiplier (0.7-1.3)
