// ============================================================================
// pressure_tracker.cfg — L4D2 Dynamic Difficulty Pressure System
// ============================================================================
// 全局压力值追踪系统，根据团队表现动态调整难度段位。
//
// 段位系统 (5 tiers):
//   T1 Casual    (20-35):  休闲模式，特感保守，刷新慢
//   T2 Standard  (35-50):  标准难度，默认起始段位
//   T3 Challenge (50-65):  挑战模式，压力平衡点
//   T4 Hard      (65-80):  困难模式，特感激进，刷新快
//   T5 Hell      (80-100): 地狱模式，极限压迫
//
// 关联系统:
//   - specialspawner: 读取 sm_pressure_tier 调整波次参数
//   - si_composition_manager: 读取 sm_pressure_tier 过滤战术
//   - AI_HardSI: 读取 sm_pressure_aggression 调整攻击性
// ============================================================================

// --- Core Settings ---
sm_pressure_enable "1"
// 启用压力追踪系统
// 0 = 关闭（所有消费者回退默认行为）
// 1 = 启用

sm_pressure_announce "1"
// 段位切换时聊天播报
// 0 = 静默
// 1 = 播报 "特感威胁正在上升" 等提示

// --- Published CVars (只读，由系统自动更新) ---
// sm_pressure_value   — 当前压力值 (20-100)
// sm_pressure_tier    — 当前段位 (1-5)
// sm_pressure_aggression — AI 攻击性 (0.7-1.3)

// --- Pressure Accumulation (压力积累) ---
sm_pressure_perfect_wave "5"
// 完美波次奖励（无倒地无死亡）
// 默认 +5

sm_pressure_perfect_streak "8"
// 完美连击奖励（连续 5 波完美）
// 默认 +8（叠加在第 5 波）

sm_pressure_fast_clear "3"
// 快速清剿奖励（<25 秒清完一波）
// 默认 +3

// --- Pressure Release (压力释放) ---
sm_pressure_incap_penalty "4"
// 倒地惩罚（每人次）
// 默认 -4

sm_pressure_death_penalty "8"
// 死亡惩罚（每人次）
// 默认 -8

sm_pressure_damage_threshold "400"
// 伤害阈值（一波承受伤害超过此值触发惩罚）
// 默认 400

sm_pressure_damage_penalty "2"
// 伤害惩罚（超过阈值时）
// 默认 -2

sm_pressure_slow_clear "2"
// 慢速清剿惩罚（>60 秒才清完一波）
// 默认 -2

sm_pressure_decay_per_wave "1"
// 自然衰减（每波固定衰减，防止无限上涨）
// 默认 -1

// --- Team Wipe ---
sm_pressure_wipe_reset "30"
// 团灭重置压力值
// 默认 30（回到 T2 低位）

// --- Tier Stabilization (段位稳定) ---
sm_pressure_tier_stable_t1_t2 "3"
// T1 ↔ T2 切换需要连续波数
// 默认 3 波

sm_pressure_tier_stable_t2_t3 "3"
// T2 ↔ T3 切换需要连续波数
// 默认 3 波

sm_pressure_tier_stable_t3_t4 "4"
// T3 ↔ T4 切换需要连续波数
// 默认 4 波

sm_pressure_tier_stable_t4_t5 "5"
// T4 ↔ T5 切换需要连续波数（最难升档）
// 默认 5 波

// ============================================================================
// 调参建议
// ============================================================================
//
// **想要更快升段位（更激进）**:
//   - 增加 perfect_wave / fast_clear
//   - 减少 decay_per_wave
//   - 减少 tier_stable_* 波数要求
//
// **想要更难降段位（保持压力）**:
//   - 减少 incap_penalty / death_penalty
//   - 增加 wipe_reset 值（团灭不会降太多）
//
// **想要更平滑的难度曲线**:
//   - 增加所有 tier_stable_* 波数（更慢切换）
//   - 减少单波奖惩幅度
//
// ============================================================================
