// Weapon attribute tuning - loaded ONCE at startup via server.cfg
// NOT in sourcemod.cfg to avoid Cbuf overflow on map change
// Updated: 2026-07-29 — rangemod 重构，衰减公式解析见下方
//
// === L4D2 伤害衰减公式 (Source 引擎验证) ===
//   if distance ≤ GainRange:   multiplier = 1.0           (全额)
//   elif distance ≥ Range:     multiplier = RangeModifier  (最低)
//   else:  线性插值 1.0 → RangeModifier
//
// 结论: RangeModifier 接近 1.0 时曲线几乎平坦，改 GainRange 无感。
// 修复策略:
//   - 步枪/SMG/狙击 → rangemod=1.00 (零衰减，全射程满伤)
//   - 手枪/霰弹      → rangemod=0.92 (最远衰减 ~8%)
//   - GainRange 推到贴近 Range，衰减段尽量短

// ============================================================
// SMG: 9mm, high RPM close-range bullet hoses → 零衰减
// ============================================================
sm_weapon smg damage 33
sm_weapon smg cycletime 0.0625
sm_weapon smg range 4200
sm_weapon smg rangemod 1.00
sm_weapon smg gainrange 4100
sm_weapon smg minstandspread 0.45
sm_weapon smg minmovespread 0.50
sm_weapon smg mincrouchspread 0.30
sm_weapon smg penpower 50
