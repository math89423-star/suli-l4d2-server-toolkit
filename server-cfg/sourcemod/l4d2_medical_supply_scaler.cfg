// Medical Supply Scaler - add extra medical supplies in safe room
// v3.0: enable/disable only, no per-player scaling

// Enable extra medkits (0=off, 1=on)
// Default: "1"
sm_med_enable "1"

// Enable extra pain pills (0=off, 1=on)
// Default: "1"
sm_pills_enable "1"

// Enable extra adrenaline (0=off, 1=on)
// Default: "1"
sm_adren_enable "1"
