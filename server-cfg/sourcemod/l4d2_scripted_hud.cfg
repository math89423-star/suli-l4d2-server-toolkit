// l4d2_scripted_hud.cfg - leaderboard renderer layout (fixed by scoreboard_ui project 2026-08-26)
// 4 slots stacked left: HUD1=title HUD2=#1 HUD3=#2 HUD4=#3
// hudN_text is written every second by l4d2_scoreboard_ui - do not set text here
// NOTE: team must be 0 (all). This build compiles hud3_team default = 2 (infected only)
//       which made rank #2 invisible to survivors!

l4d2_scripted_hud_enable "1"
l4d2_scripted_hud_update_interval "0.1"

l4d2_scripted_hud_hud1_x "0.02"
l4d2_scripted_hud_hud1_y "0.02"
l4d2_scripted_hud_hud1_width "0.9"
l4d2_scripted_hud_hud1_height "0.03"
l4d2_scripted_hud_hud1_team "0"
l4d2_scripted_hud_hud1_visible "1"
l4d2_scripted_hud_hud1_background "0"
l4d2_scripted_hud_hud1_blink "0"
l4d2_scripted_hud_hud1_beep "0"
l4d2_scripted_hud_hud1_blink_tank "0"
l4d2_scripted_hud_hud1_text_align "1"

l4d2_scripted_hud_hud2_x "0.02"
l4d2_scripted_hud_hud2_y "0.06"
