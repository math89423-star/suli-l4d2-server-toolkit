// ConVars for plugin "l4d2_mounted_gun_damage.smx"


// 0=OFF, 1=ON.
l4d2_mg_enable "1"

// Damage multiplier for 7.62mm rotary minigun (prop_minigun). 1.0 = default.
l4d2_mg_minigun_damage "3.0"

// Damage multiplier for 12.7mm heavy MG (prop_mounted_machine_gun). 1.0 = default.
l4d2_mg_50cal_damage "27.5"

// 0=OFF (vanilla overheat), 1=ON (use rate below).
l4d2_mg_overheat_enable "1"

// Minigun overheat rate. 1.0=normal, 0.33=3x firing window, 0.0=never overheat.
// Cooling speed is NOT affected — only the heat buildup rate is scaled.
l4d2_mg_overheat_rate "0.33"
