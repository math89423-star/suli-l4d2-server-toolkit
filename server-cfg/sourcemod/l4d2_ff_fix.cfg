// FF damage — this plugin REPLACES engine FF entirely
// FF = weapon_damage × sm_ff_multiplier (engine survivor_friendly_fire_factor_* has NO effect)
// 0.08 = 8% of weapon damage as FF (matching survivor_friendly_fire_factor_hard = 0.08 intent)
sm_ff_multiplier 0.08
// Fire/molotov friendly fire multiplier
sm_ff_fire_multiplier 1.0
