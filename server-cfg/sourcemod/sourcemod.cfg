// SourceMod Configuration File
// Weapon tuning moved to weapon_init.cfg (exec'd once at startup by server.cfg)
// This file is re-executed on every map change — keep it lightweight!

sm_show_activity 13
sm_menu_sounds 1
sm_vote_delay 30
sm_datetime_format "%m/%d/%Y - %H:%M:%S"
sm_immunity_mode 1
sm_time_adjustment 0
sm_flood_time 0.75
sm_reserve_type 0
sm_reserved_slots 0
sm_hide_slots 0
sm_chat_mode 1
sm_timeleft_interval 0
sm_trigger_show 0
sm_vote_progress_hintbox 0
sm_vote_progress_chat 0
sm_vote_progress_console 0
sm_vote_progress_client_console 0

// Cheat-protected cvars (must use sm_cvar, won't work in server.cfg)
sm_cvar grenadelauncher_damage 900
sm_cvar z_gun_vertical_punch 0
sm_cvar z_gun_horiz_punch 0
sm_cvar z_witch_health 1500
sm_cvar survivor_friendly_fire_factor_easy 0.02
sm_cvar survivor_friendly_fire_factor_normal 0.04
sm_cvar survivor_friendly_fire_factor_hard 0.08
sm_cvar survivor_friendly_fire_factor_expert 0.15
sm_cvar rescue_min_dead_time 5
sm_cvar z_common_limit 200
sm_cvar sb_max_team_melee_weapons 10

// Engine cvars (game DLL must be loaded first, may reset on map change)
sm_cvar sv_hibernate_when_empty 0
sm_cvar mp_gamemode coop
sm_cvar sb_melee_approach_victim 1
sm_cvar sv_allow_lobby_connect_only 0

// Reserve ammo
sm_cvar ammo_smg_max 720
sm_cvar ammo_assaultrifle_max 540
sm_cvar ammo_shotgun_max 192
sm_cvar ammo_autoshotgun_max 270
sm_cvar ammo_huntingrifle_max 225
sm_cvar ammo_sniperrifle_max 270
sm_cvar ammo_m60_max 0
sm_cvar ammo_grenadelauncher_max 30

sm_cvar sv_maxplayers 24
sm_cvar sv_visiblemaxplayers 24

// Fire pool tuning
sm_cvar z_friendly_fire_forgiveness 0
sm_cvar inferno_damage 55
sm_cvar inferno_flame_lifetime 15
sm_cvar inferno_max_range 550
sm_cvar survivor_burn_factor_easy 0.3
sm_cvar survivor_burn_factor_normal 0.4
sm_cvar survivor_burn_factor_hard 0.5
sm_cvar survivor_burn_factor_expert 0.8

// NextBot AI update frequency
sm_cvar nb_update_frequency 0.033

// Plugin cvars
// ss_time_* removed — managed by specialspawner.cfg + si_composition_manager
// was: sm_cvar ss_time_min 40 / ss_time_max 60 / ss_time_mode 1 (escalating mode = ~10s waves!)
sm_cvar ss_base_limit 8
sm_cvar ss_extra_limit 2.0
sm_cvar ss_si_limit 32  // cvar 声明 max=32; 类别上限合计 22 先绑
sm_cvar ss_first_time 20.0
sm_cvar ss_suicide_time 25.0
sm_cvar l4d2_ammo_set_enabled_ammo_Ammosets 1
sm_cvar l4d2_ammo_set_enabled_ammo_Ammosets_switch 1
sm_cvar sm_l4d_fmc_crec_coop_map 4
sm_cvar sm_l4d_fmc_crec_coop_final 4

// AI HardSI tuning
// v4.0.2: 冲锋距离 500→750（v3.6 设计值"more aggressive charging"）。
// 注意: 这是实际生效路径（sourcemod.cfg 每图 exec）;AI_HardSI.cfg 是旧插件名遗留死配置。
// 行为树只在插件加载时读一次本值,改后需 sm plugins reload AI_HardSI_bt。
sm_cvar ai_charge_proximity 750
sm_cvar ai_health_threshold_charger 200
sm_cvar ai_hop_activation_proximity 700
sm_cvar ai_coordination_window 4.0

// Loot drop — common infected drop rate (v1.5.0)
sm_cvar sm_loot_common_chance 2.0
// 特感掉落重型武器 (M60/榴弹) 概率
sm_cvar sm_loot_si_weapon_chance 1.0
// Witch 额外掉落重型武器概率
sm_cvar sm_loot_witch_weapon_chance 20.0

// Weapon attributes — loaded ONCE but must be after SourceMod loads
// command_buffer.smx handles Cbuf_AddText buffer overflow
exec weapon_init.cfg

// === 武器射程修复（2026-08-14）===
// 解决引擎硬编码射程限制问题
sm plugins load l4d2_weapon_range_fix
sm_range_fix_enable 1
sm_range_fix_multiplier 2.0
sm_range_fix_max 8192
sm_range_fix_debug 1

// === 射程诊断工具（2026-08-14）===
sm plugins load l4d2_range_diagnostic

// === GSLT (Game Server Login Token) ===
// 必须在 SourceMod 加载后执行（放 server.cfg 太早会报 Unknown command）
// 每次换图都会重新执行，确保 Steam master server 正确识别服务器身份
sm_cvar sv_setsteamaccount "F18404622EF86F67F587566BBC9350F5"
